name: Okteto Cloud Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Okteto Context
        uses: okteto/context@latest
        with:
          token: ${{ secrets.OKTETO_TOKEN }}

      - name: Create Namespace
        uses: okteto/create-namespace@latest
        with:
          namespace: ${{ github.head_ref || github.ref_name }}

      - name: Deploy Application
        uses: okteto/deploy-stack@latest
        continue-on-error: true
        with:
          build: true

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Configure Okteto Context
        uses: okteto/context@latest
        with:
          token: ${{ secrets.OKTETO_TOKEN }}

      - name: Delete Namespace
        uses: okteto/delete-namespace@latest
        with:
          namespace: ${{ github.head_ref }}
