name: Application Quality Gates

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run privacy and contract tests
        run: npm test

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Access Approval service dependencies
        working-directory: services/access-approval
        run: pip install -r requirements.txt

      - name: Run Access Approval monitor tests
        working-directory: services/access-approval
        run: python -m unittest discover -s tests -v
